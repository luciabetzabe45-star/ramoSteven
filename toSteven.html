
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Especialmente para Steven 🏎️</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 10px;
    background:
      radial-gradient(ellipse at 50% 35%,
      #fff 0%, #fff1f3 48%, #f4dce1 100%);
    font-family: Georgia, serif;
    color: #8d172b;
}

h1 {
    text-align: center;
    font-size: clamp(22px, 5vw, 32px);
    margin: 5px 0 0;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px #d7a0a055;
}

.subtitulo {
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #a76b74;
    text-align: center;
    margin: 10px 0 0;
}

.ramo {
    width: min(96vw, 480px);
    filter: drop-shadow(0 18px 16px #71333b25);
}

svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
}

.carro {
    cursor: pointer;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .35s ease;
}

.carro:hover {
    transform: translateY(-8px) scale(1.06);
}

.mensaje {
    max-width: 340px;
    text-align: center;
    font-size: 18px;
    line-height: 1.5;
    color: #941e34;
    margin: 0 15px 8px;
}

button {
    background: linear-gradient(135deg, #e84960, #a90e2b);
    border: 1px solid #ffb5c0;
    border-radius: 30px;
    color: white;
    padding: 13px 24px;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 5px 15px #9c263533;
    transition: transform .2s;
}

button:hover { transform: translateY(-2px); }

.nota {
    font: 11px Arial, sans-serif;
    color: #a77b81;
    margin-top: 14px;
}
</style>
</head>

<body>

<h1>Especialmente para Steven ❤️</h1>
<p class="subtitulo">Un detalle hecho con cariño</p>

<div class="ramo">
<svg viewBox="0 0 440 590"
     xmlns="http://www.w3.org/2000/svg">

<defs>
  <!-- Sombras -->
  <filter id="sombra" x="-40%" y="-40%"
          width="180%" height="190%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>

  <linearGradient id="rojo" x1="0" y1="0"
                  x2="1" y2="1">
    <stop stop-color="#ff9ba9"/>
    <stop offset=".35" stop-color="#e72c4b"/>
    <stop offset=".7" stop-color="#ad102e"/>
    <stop offset="1" stop-color="#650c22"/>
  </linearGradient>

  <linearGradient id="petalo" x1="0" y1="0"
                  x2=".8" y2="1">
    <stop stop-color="#ffd1d8"/>
    <stop offset=".35" stop-color="#fa7188"/>
    <stop offset=".75" stop-color="#d91d43"/>
    <stop offset="1" stop-color="#8f102c"/>
  </linearGradient>

  <linearGradient id="hoja" x1="0" y1="0"
                  x2="1" y2="1">
    <stop stop-color="#9acb80"/>
    <stop offset=".5" stop-color="#43824c"/>
    <stop offset="1" stop-color="#1e5032"/>
  </linearGradient>

  <linearGradient id="papelNegro" x1="0" y1="0"
                  x2="1" y2=".2">
    <stop stop-color="#09090d"/>
    <stop offset=".25" stop-color="#303039"/>
    <stop offset=".5" stop-color="#101015"/>
    <stop offset=".78" stop-color="#29242a"/>
    <stop offset="1" stop-color="#08080c"/>
  </linearGradient>

  <linearGradient id="papelRojo" x1="0" y1="0"
                  x2="1" y2="0">
    <stop stop-color="#8c1026"/>
    <stop offset=".25" stop-color="#f54b61"/>
    <stop offset=".48" stop-color="#bc1637"/>
    <stop offset=".7" stop-color="#fa6373"/>
    <stop offset="1" stop-color="#8b1029"/>
  </linearGradient>

  <linearGradient id="metalRojo" x1="0" y1="0"
                  x2="0" y2="1">
    <stop stop-color="#ffb2a7"/>
    <stop offset=".18" stop-color="#ff3b2f"/>
    <stop offset=".43" stop-color="#d60012"/>
    <stop offset=".65" stop-color="#ff6250"/>
    <stop offset="1" stop-color="#79000a"/>
  </linearGradient>

  <linearGradient id="metalAzul" x1="0" y1="0"
                  x2="0" y2="1">
    <stop stop-color="#a8f2ff"/>
    <stop offset=".22" stop-color="#20bfff"/>
    <stop offset=".55" stop-color="#0755c9"/>
    <stop offset=".8" stop-color="#1541a1"/>
    <stop offset="1" stop-color="#071d55"/>
  </linearGradient>

  <linearGradient id="metalOro" x1="0" y1="0"
                  x2="0" y2="1">
    <stop stop-color="#fff3a1"/>
    <stop offset=".25" stop-color="#ffcc30"/>
    <stop offset=".55" stop-color="#e98a00"/>
    <stop offset=".8" stop-color="#b74b00"/>
    <stop offset="1" stop-color="#663000"/>
  </linearGradient>

  <linearGradient id="metalMorado" x1="0" y1="0"
                  x2="0" y2="1">
    <stop stop-color="#edbaff"/>
    <stop offset=".3" stop-color="#a53aff"/>
    <stop offset=".65" stop-color="#6220bd"/>
    <stop offset="1" stop-color="#260b59"/>
  </linearGradient>

  <linearGradient id="lazo" x1="0" y1="0"
                  x2="1" y2="1">
    <stop stop-color="#ffb5bf"/>
    <stop offset=".25" stop-color="#e72c4b"/>
    <stop offset=".5" stop-color="#9f102d"/>
    <stop offset=".75" stop-color="#f6536a"/>
    <stop offset="1" stop-color="#8c1026"/>
  </linearGradient>

  <!-- Rosa detallada -->
  <g id="rosa">
    <ellipse rx="26" ry="17" cy="3"
             fill="#8d102c" opacity=".4"
             filter="url(#sombra)"/>

    <g fill="url(#petalo)" stroke="#bd2140"
       stroke-width=".8">
      <ellipse cy="-10" rx="12" ry="21"/>
      <ellipse cy="-10" rx="12" ry="21"
               transform="rotate(45)"/>
      <ellipse cy="-10" rx="12" ry="21"
               transform="rotate(90)"/>
      <ellipse cy="-10" rx="12" ry="21"
               transform="rotate(135)"/>
      <ellipse cy="-10" rx="12" ry="21"
               transform="rotate(180)"/>
      <ellipse cy="-10" rx="12" ry="21"
               transform="rotate(225)"/>
      <ellipse cy="-10" rx="12" ry="21"
               transform="rotate(270)"/>
      <ellipse cy="-10" rx="12" ry="21"
               transform="rotate(315)"/>
    </g>

    <g fill="url(#rojo)" stroke="#a51131"
       stroke-width=".7">
      <ellipse cy="-7" rx="8" ry="14"
               transform="rotate(22)"/>
      <ellipse cy="-7" rx="8" ry="14"
               transform="rotate(112)"/>
      <ellipse cy="-7" rx="8" ry="14"
               transform="rotate(202)"/>
      <ellipse cy="-7" rx="8" ry="14"
               transform="rotate(292)"/>
    </g>

    <path d="M-7 -2 Q-9 -13 0 -15
             Q11 -12 6 -3 Q2 3 -3 4
             Q-10 1 -5 -6 Q0 -10 3 -5"
          fill="none" stroke="#ffb1bb"
          stroke-width="3" stroke-linecap="round"/>
    <circle cy="-1" r="3" fill="#9b122d"/>
  </g>

  <!-- Carrito deportivo -->
  <g id="carro">
    <!-- Sombra debajo del coche -->
    <ellipse cx="0" cy="10" rx="36" ry="5"
             fill="#08080b" opacity=".4"/>

    <!-- Alerón -->
    <path d="M-29 -5 L-35 -13 L-21 -13 L-18 -5"
          fill="#24242a" stroke="#09090b"
          stroke-width="1.5"/>

    <!-- Carrocería -->
    <path d="M-37 1 L-32 -7 L-19 -10
             L-9 -22 Q-5 -26 6 -24
             L21 -12 L32 -8 L38 1
             L36 9 L-36 9 Z"
          fill="currentColor" stroke="#202027"
          stroke-width="2" stroke-linejoin="round"/>

    <!-- Ventanas -->
    <path d="M-15 -10 L-7 -21
             Q-5 -23 2 -22 L7 -11 Z"
          fill="#c8efff" stroke="#333"
          stroke-width="1.4"/>

    <path d="M10 -11 L5 -22
             L8 -21 L21 -12 Z"
          fill="#80c8e8" stroke="#333"
          stroke-width="1.4"/>

    <!-- Reflejo de pintura -->
    <path d="M-31 -5 L-17 -8 L-5 -9
             L19 -8"
          fill="none" stroke="#fff"
          stroke-width="2" opacity=".8"/>

    <!-- Franjas deportivas -->
    <path d="M-20 0 L17 0"
          stroke="#fff" stroke-width="2.3"
          opacity=".85"/>
    <path d="M-17 4 L12 4"
          stroke="#fff" stroke-width="1"
          opacity=".6"/>

    <!-- Luces -->
    <path d="M29 -3 L35 0 L30 2"
          fill="#fff5b0"/>
    <path d="M-35 0 L-31 -2 L-31 2"
          fill="#ffb6a6"/>

    <!-- Ruedas -->
    <g>
      <circle cx="-23" cy="8" r="8"
              fill="#09090c" stroke="#555"
              stroke-width="1.5"/>
      <circle cx="-23" cy="8" r="4"
              fill="#c7c9cf"/>
      <circle cx="-23" cy="8" r="1.5"
              fill="#555"/>

      <circle cx="23" cy="8" r="8"
              fill="#09090c" stroke="#555"
              stroke-width="1.5"/>
      <circle cx="23" cy="8" r="4"
              fill="#c7c9cf"/>
      <circle cx="23" cy="8" r="1.5"
              fill="#555"/>
    </g>

    <!-- Chasis inferior -->
    <path d="M-29 11 L29 11"
          stroke="#1c1c22" stroke-width="3"/>
  </g>
</defs>

<!-- Tallos y hojas al fondo -->
<g fill="none" stroke="#326b3c"
   stroke-width="5" stroke-linecap="round">
  <path d="M220 485 Q160 290 62 150"/>
  <path d="M220 485 Q185 270 130 105"/>
  <path d="M220 485 L220 83"/>
  <path d="M220 485 Q260 260 310 110"/>
  <path d="M220 485 Q310 300 370 160"/>
  <path d="M220 485 Q130 330 105 230"/>
  <path d="M220 485 Q320 330 330 235"/>
</g>

<g fill="url(#hoja)" stroke="#2d6338"
   stroke-width="1">
  <path d="M160 340 Q110 290 98 320
           Q112 350 160 340Z"/>
  <path d="M260 370 Q310 320 330 345

  <path d="M165 410 Q110 365 95 395
           Q120 425 165 410Z"/>
  <path d="M265 300 Q310 260 326 280
           Q310 315 265 300Z"/>
  <path d="M190 275 Q140 230 128 255
           Q145 280 190 275Z"/>
  <path d="M270 430 Q315 390 335 415
           Q310 445 270 430Z"/>
</g>

<!-- Flores posteriores -->
<g>
  <use href="#rosa" x="62" y="150" transform="rotate(-15 62 150)"/>
  <use href="#rosa" x="130" y="105"/>
  <use href="#rosa" x="220" y="83"/>
  <use href="#rosa" x="310" y="110" transform="rotate(12 310 110)"/>
  <use href="#rosa" x="370" y="160"/>
  <use href="#rosa" x="105" y="230"/>
  <use href="#rosa" x="330" y="235"/>
</g>

<!-- Carritos: se sitúan delante de las flores -->
<g class="carro" style="color:url(#metalRojo)"
   transform="translate(115 175) rotate(-13) scale(1.1)">
  <use href="#carro" style="color:#e51c2a"/>
</g>

<g class="carro"
   transform="translate(220 145) rotate(3) scale(1.2)">
  <use href="#carro" style="color:#0878dd"/>
</g>

<g class="carro"
   transform="translate(325 180) rotate(15) scale(1.08)">
  <use href="#carro" style="color:#eaa000"/>
</g>

<g class="carro"
   transform="translate(155 245) rotate(-8) scale(1.05)">

</g>

<g class="carro"
   transform="translate(285 250) rotate(10) scale(1.08)">

</g>

<!-- Papel exterior negro -->
<path d="M48 275 L220 365 L392 275
         L330 510 L110 510 Z"
      fill="url(#papelNegro)"

<!-- Pliegues del papel negro -->
<path d="M48 275 L125 480 L220 365 Z"

<!-- Papel rojo interior -->
<path d="M72 290 L220 375 L368 290
         L310 475 L130 475 Z"
      fill="url(#papelRojo)"
      stroke="#7e0b23" stroke-width="2"/>

<!-- Brillos del papel -->
<path d="M72 290 L143 440 L220 375"
      fill="none" stroke="#ff9ba8"
      stroke-width="2" opacity=".8"/>
<path d="M368 290 L295 440 L220 375"
      fill="none" stroke="#ff9ba8"
      stroke-width="2" opacity=".65"/>

<!-- Base y envoltorio inferior -->
<path d="M130 465 L310 465 L280 535
         L160 535 Z"
      fill="url(#papelNegro)"
      stroke="#08080b" stroke-width="2"/>

<path d="M160 470 L220 490 L280 470
         L260 525 L180 525 Z"

<!-- Lazo con volumen -->
<path d="M218 485
         C175 425 100 445 157 490
         L218 510
         C170 465 210 455 218 485 Z"
      fill="url(#lazo)" stroke="#800d25"
      stroke-width="2"/>

<path d="M222 485
         C265 425 340 445 283 490
         L222 510
         C270 465 230 455 222 485 Z"

<path d="M205 498 L175 555 L220 535
         L245 555 L235 498 Z"
      fill="url(#lazo)" stroke="#800d25"
      stroke-width="2"/>

<ellipse cx="220" cy="490" rx="17" ry="15"
         fill="url(#lazo)" stroke="#ffd0d5"
         stroke-width="2"/>

<ellipse cx="215" cy="485" rx="5" ry="4"
         fill="#ffb7c1" opacity=".8"/>

<!-- Pequeña etiqueta -->
<path d="M275 395 L326 408 L318 447
         L267 434 Z"
      fill="#fff0e8" stroke="#b88c79"
      stroke-width="1.5"/>

<text x="297" y="421"
      font-size="9" fill="#8d172b"
      text-anchor="middle"
      transform="rotate(14 297 421)"
      font-family="Georgia">Para ti</text>

</svg>
</div>

<div class="mensaje" id="mensaje">
  Para alguien que ama la velocidad ❤️
</div>

<button onclick="cambiarMensaje()">
  Una dedicatoria para Steven 💌
</button>

<p class="nota">Hecho especialmente para ti · 🏁 de Lu</p>

<script>
const mensajes = [
  "Eres una gran persona 🏎️❤️",
  "Siempre maneja con cuidado 💨",
  "Un detalle para alguien especial 💐",
  "Jamás dejes de creer en ti ❤️",
  "¡Llega siempre a la meta! 🏁",
  "Que nunca te falten motivos para sonreír.",
  "Sigue acelerando hacia tus sueños 🏎️"
];

let indice = -1;

function cambiarMensaje() {
  indice = (indice + 1) % mensajes.length;
  document.getElementById("mensaje").textContent =
    mensajes[indice];
}
</script>

</body>
</html>
